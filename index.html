<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hilton Aspire $200 Resort Credit Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <style>
    #map { height: 520px; z-index: 1; }
    @media (min-width: 1024px) { #map { height: calc(100vh - 220px); position: sticky; top: 1.5rem; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

  <header class="bg-blue-950 text-white py-6 px-4 shadow-md">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Hilton Aspire Resort Credit Finder</h1>
        <p class="text-blue-200 text-sm mt-1">Search eligible properties for the semi-annual $200 Amex Hilton Aspire Resort Credit</p>
      </div>
      <div class="bg-blue-900/80 border border-blue-700 rounded-lg px-4 py-2.5 text-xs text-blue-100 max-w-md">
        <strong>Reminder:</strong> Must book direct &amp; pay at the property (flexible rates, dining, spa, resort fees). Advance Purchase / prepaid rates do not qualify.
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
      <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
        <div class="md:col-span-6">
          <label for="searchInput" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Search Resort, City, or Country</label>
          <input id="searchInput" type="text" placeholder="e.g., Orlando, Waldorf, Maldives, Las Vegas..."
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-sm" />
        </div>
        <div class="md:col-span-3">
          <label for="brandFilter" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Brand</label>
          <select id="brandFilter" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 bg-white text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            <option value="ALL">All Brands</option>
          </select>
        </div>
        <div class="md:col-span-3">
          <label for="countryFilter" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Country / Region</label>
          <select id="countryFilter" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 bg-white text-sm focus:ring-2 focus:ring-blue-600 outline-none">
            <option value="ALL">All Countries</option>
          </select>
        </div>
      </div>
      <div class="mt-3 flex items-center justify-between text-xs text-slate-500">
        <span id="resultCount">Loading resorts...</span>
        <button id="resetBtn" class="text-blue-700 hover:underline font-medium">Reset filters</button>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <div id="resortList" class="lg:col-span-6 space-y-3"></div>
      <div class="lg:col-span-6">
        <div id="map" class="w-full rounded-xl shadow-sm border border-slate-200"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>

  <footer class="max-w-7xl mx-auto px-4 py-6 text-center">
    <div id="hits-badge" class="inline-block"></div>
  </footer>

  <script>
    (function() {
      const p = 'https:' + '//';
      const img = document.createElement('img');
      img.alt = 'Page Views';
      img.src = p + 'hits.sh/tanvir-irfan.github.io/aspire-resorts.svg?label=Views&color=1e3a8a&labelColor=0f172a';
      document.getElementById('hits-badge').appendChild(img);
    })();
  </script>
</body>
</html>
